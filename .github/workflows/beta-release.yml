name: Beta Release

on:
  push:
    tags:
      - 'v*-beta*'
      - 'beta-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0-beta.1)'
        required: true
        default: 'v1.0.0-beta.1'

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Linux x64
  # ──────────────────────────────────────────────────────────────────────
  build-linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make \
            qt6-base-dev libqt6sql6-sqlite \
            libsqlite3-dev libsodium-dev
      - name: Build ShelfSight
        working-directory: src
        run: |
          qmake6 ShelfSight.pro CONFIG+=release
          make -j$(nproc)
      - name: Verify binary
        working-directory: src/app
        run: file ShelfSight | grep -q "ELF 64-bit"
      - name: Package
        run: |
          OUT="build/ShelfSight-linux-x64"
          mkdir -p "$OUT/bin"
          cp src/app/ShelfSight "$OUT/bin/"
          cp LICENSE "$OUT/" 2>/dev/null || true
          cat > "$OUT/ShelfSight.sh" << 'LAUNCHER'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$SCRIPT_DIR/bin/ShelfSight" "$@"
          LAUNCHER
          chmod +x "$OUT/ShelfSight.sh"
          cat > "$OUT/install.sh" << 'INSTALL'
          #!/bin/bash
          set -e
          sudo mkdir -p /opt/ShelfSight
          sudo cp -r "$(dirname "$0")"/* /opt/ShelfSight/
          sudo chmod +x /opt/ShelfSight/ShelfSight.sh
          echo "Installed to /opt/ShelfSight"
          INSTALL
          chmod +x "$OUT/install.sh"
          cd build && tar czf ShelfSight-linux-x64.tar.gz ShelfSight-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ShelfSight-linux-x64
          path: build/ShelfSight-linux-x64.tar.gz

  # ──────────────────────────────────────────────────────────────────────
  # Linux x86 (native i386 via Docker)
  # ──────────────────────────────────────────────────────────────────────
  build-linux-x86:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build in i386 container
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            i386/debian:bookworm bash -c '
              apt-get update -qq &&
              apt-get install -y -qq g++ make pkg-config \
                qt6-base-dev libqt6sql6-sqlite \
                libsqlite3-dev libsodium-dev &&
              cd src &&
              qmake6 ShelfSight.pro CONFIG+=release &&
              make -j$(nproc)
            '
      - name: Verify binary
        run: file src/app/ShelfSight | grep -q "ELF 32-bit"
      - name: Package
        run: |
          OUT="build/ShelfSight-linux-x86"
          mkdir -p "$OUT/bin"
          cp src/app/ShelfSight "$OUT/bin/"
          cp LICENSE "$OUT/" 2>/dev/null || true
          cat > "$OUT/ShelfSight.sh" << 'LAUNCHER'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$SCRIPT_DIR/bin/ShelfSight" "$@"
          LAUNCHER
          chmod +x "$OUT/ShelfSight.sh"
          cd build && tar czf ShelfSight-linux-x86.tar.gz ShelfSight-linux-x86
      - uses: actions/upload-artifact@v4
        with:
          name: ShelfSight-linux-x86
          path: build/ShelfSight-linux-x86.tar.gz

  # ──────────────────────────────────────────────────────────────────────
  # Windows x64 (Windows XP x64 through 11)
  # ──────────────────────────────────────────────────────────────────────
  build-windows-x64:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-libsodium
            make
      - name: Build SQLiteCpp
        working-directory: src/sqlitecpp
        run: |
          qmake6 sqlitecpp.pro CONFIG+=release
          make -j$(nproc)
          cp release/libSQLiteCpp.a .
      - name: Build ShelfSight
        working-directory: src/app
        run: |
          qmake6 app.pro CONFIG+=release
          make -j$(nproc)
      - name: Verify binary
        working-directory: src/app
        run: file release/ShelfSight.exe | grep -qi "PE32+"
      - name: Package
        shell: bash
        run: |
          OUT="build/ShelfSight-windows-x64"
          mkdir -p "$OUT/bin/platforms"
          cp src/app/release/ShelfSight.exe "$OUT/bin/"
          cp LICENSE "$OUT/" 2>/dev/null || true
          MP="$MSYS2_PREFIX"
          cp "$MP/bin/libgcc_s_seh-1.dll" "$OUT/bin/" 2>/dev/null || true
          cp "$MP/bin/libstdc++-6.dll" "$OUT/bin/" 2>/dev/null || true
          cp "$MP/bin/libwinpthread-1.dll" "$OUT/bin/" 2>/dev/null || true
          for dll in Qt6Core Qt6Gui Qt6Widgets Qt6Sql; do
            cp "$MP/bin/lib${dll}.dll" "$OUT/bin/" 2>/dev/null || true
          done
          cp "$MP/bin/libsodium.dll" "$OUT/bin/" 2>/dev/null || true
          find "$MP" -name "qwindows.dll" -path "*/platforms/*" -exec cp {} "$OUT/bin/platforms/" \; 2>/dev/null || true
          cd build && 7z a -tzip ShelfSight-windows-x64.zip ShelfSight-windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ShelfSight-windows-x64
          path: build/ShelfSight-windows-x64.zip

  # ──────────────────────────────────────────────────────────────────────
  # Windows x86 (Windows 2000 through 11)
  # ──────────────────────────────────────────────────────────────────────
  build-windows-x86:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-toolchain
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja
            make

      - name: Build libsodium for i686
        shell: msys2 {0}
        run: |
          curl -L -o /tmp/libsodium.tar.gz \
            "https://download.libsodium.org/libsodium/releases/libsodium-1.0.20.tar.gz"
          cd /tmp && tar xzf libsodium.tar.gz
          cd libsodium-*
          ./configure --prefix=/mingw32 --host=i686-w64-mingw32 --enable-minimal
          make -j$(nproc)
          make install
      - name: Build Qt6 from source (i686) — cached
        uses: actions/cache@v4
        id: qt-cache
        with:
          path: ${{ runner.temp }}/qt6-i686
          key: qt6-i686-mingw32-v6

      - name: Download and build Qt6 (i686)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          QT_VER=6.5.3
          QT_PREFIX="$RUNNER_TEMP/qt6-i686"
          curl -L -o /tmp/qt-src.tar.xz \
            "https://download.qt.io/official_releases/qt/6.5/${QT_VER}/single/qt-everywhere-src-${QT_VER}.tar.xz"
          cd /tmp && tar xf qt-src.tar.xz
          cd "qt-everywhere-src-${QT_VER}"
          ./configure \
            -prefix "$QT_PREFIX" \
            -platform win32-g++ \
            -opensource -confirm-license \
            -nomake examples -nomake tests \
            -sql-sqlite -qt-sqlite \
            -no-sql-psql \
            -no-openssl -no-strip \
            -release \
            -skip qtopcua -skip qtwayland -skip qtlottie -skip qtquick3d \
            -skip qtquick3dphysics -skip qtquickeffectmaker \
            -skip qtdeclarative -skip qtquickcontrols2 -skip qtquicktimeline \
            -skip qtshadertools -skip qt3d -skip qtactiveqt -skip qtcharts \
            -skip qtdatavis3d -skip qtmultimedia -skip qtscxml -skip qtsvg \
            -skip qtwebengine -skip qtwebview -skip qtlocation -skip qtdoc \
            -skip qtmqtt -skip qtgrpc -skip qtwebchannel -skip qtnetworkauth \
            -skip qtcoap -skip qtmqtts -skip qtremoteobjects -skip qtserialbus \
            -skip qtserialport -skip qtspeech -skip qttest -skip qtvirtualkeyboard \
            -skip qtwebsockets -skip qtwebview -skip qt3dquick -skip qt3drender
          cmake --build . --parallel $(nproc)
          cmake --install .

      - name: Build SQLiteCpp
        working-directory: src/sqlitecpp
        run: |
          QT_DIR="$RUNNER_TEMP/qt6-i686"
          export PATH="$QT_DIR/bin:$MSYS2_PREFIX/bin:$PATH"
          qmake6 sqlitecpp.pro CONFIG+=release
          make -j$(nproc)
          cp release/libSQLiteCpp.a . 2>/dev/null || true

      - name: Build ShelfSight
        working-directory: src/app
        run: |
          QT_DIR="$RUNNER_TEMP/qt6-i686"
          export PATH="$QT_DIR/bin:$MSYS2_PREFIX/bin:$PATH"
          qmake6 app.pro CONFIG+=release \
            "INCLUDEPATH+=$QT_DIR/include" \
            "INCLUDEPATH+=$MSYS2_PREFIX/include" \
            "LIBS+=-L$QT_DIR/lib -L$MSYS2_PREFIX/lib"
          make -j$(nproc)

      - name: Verify binary
        working-directory: src/app
        run: file release/ShelfSight.exe | grep -qi "PE32"

      - name: Package
        shell: bash
        run: |
          OUT="build/ShelfSight-windows-x86"
          mkdir -p "$OUT/bin/platforms"
          cp src/app/release/ShelfSight.exe "$OUT/bin/"
          cp LICENSE "$OUT/" 2>/dev/null || true
          MP="$MSYS2_PREFIX"
          QT="$RUNNER_TEMP/qt6-i686"
          cp "$MP/bin/libgcc_s_dw2-1.dll" "$OUT/bin/" 2>/dev/null || true
          cp "$MP/bin/libstdc++-6.dll" "$OUT/bin/" 2>/dev/null || true
          cp "$MP/bin/libwinpthread-1.dll" "$OUT/bin/" 2>/dev/null || true
          for dll in Qt6Core Qt6Gui Qt6Widgets Qt6Sql; do
            cp "$QT/bin/lib${dll}.dll" "$OUT/bin/" 2>/dev/null || true
          done
          cp "$MP/bin/libsodium.dll" "$OUT/bin/" 2>/dev/null || true
          find "$QT" -name "qwindows.dll" -path "*/platforms/*" -exec cp {} "$OUT/bin/platforms/" \; 2>/dev/null || true
          cd build && 7z a -tzip ShelfSight-windows-x86.zip ShelfSight-windows-x86
      - uses: actions/upload-artifact@v4
        with:
          name: ShelfSight-windows-x86
          path: build/ShelfSight-windows-x86.zip

  # ──────────────────────────────────────────────────────────────────────
  # Create GitHub Release
  # ──────────────────────────────────────────────────────────────────────
  release:
    needs: [build-linux-x64, build-linux-x86, build-windows-x64, build-windows-x86]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ShelfSight Beta ${{ github.ref_name }}"
          body: |
            ## ShelfSight Beta

            ### Downloads
            | Platform | File |
            |----------|------|
            | Linux x64 | `ShelfSight-linux-x64.tar.gz` |
            | Linux x86 | `ShelfSight-linux-x86.tar.gz` |
            | Windows x64 | `ShelfSight-windows-x64.zip` |
            | Windows x86 | `ShelfSight-windows-x86.zip` |

            **Windows:** Extract the zip and run `ShelfSight.exe` from the `bin/` folder.
            **Linux:** Extract the tarball, run `./ShelfSight.sh`, or install with `sudo ./install.sh`.
          files: |
            artifacts/ShelfSight-linux-x64/*
            artifacts/ShelfSight-linux-x86/*
            artifacts/ShelfSight-windows-x64/*
            artifacts/ShelfSight-windows-x86/*
          prerelease: true
