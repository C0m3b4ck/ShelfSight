name: Windows Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  QT_VERSION: '6.7.0'
  QT_PATH: 'C:/Qt/6.7.0/mingw_64'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Qt6
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        cache: true

    - name: Install vcpkg
      uses: lukka/get-cmake@v3.25.4
      with:
        cmakeVersion: '3.28.0'

    - name: Install dependencies via vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.bat
        ./vcpkg/vcpkg.exe install libsodium:x64-windows sqlite3:x64-windows

    - name: Configure CMake
      working-directory: ${{ github.workspace }}/src
      run: |
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="${{ env.QT_PATH }}" \
          -DVCPKG_TARGET_TRIPLET=x64-windows \
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build
      working-directory: ${{ github.workspace }}/src/build
      run: cmake --build . --config Release --parallel

    - name: Create release package
      run: |
        mkdir release
        cp build/app/Release/ShelfSight.exe release/
        # Copy Qt DLLs
        cp "${{ env.QT_PATH }}/bin/Qt6Core.dll" release/
        cp "${{ env.QT_PATH }}/bin/Qt6Widgets.dll" release/
        cp "${{ env.QT_PATH }}/bin/Qt6Gui.dll" release/
        cp "${{ env.QT_PATH }}/bin/Qt6Sql.dll" release/
        cp "${{ env.QT_PATH }}/bin/libsqlite3-0.dll" release/ 2>$null || true
        cp vcpkg/installed/x64-windows/bin/libsodium.dll release/ 2>$null || true
        # Copy plugins
        mkdir release/platforms
        cp "${{ env.QT_PATH }}/plugins/platforms/qwindows.dll" release/platforms/
        mkdir release/sqldrivers
        cp "${{ env.QT_PATH }}/plugins/sqldrivers/qsqlite.dll" release/sqldrivers/
        # Create zip
        7z a ShelfSight-Windows.zip release/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ShelfSight-Windows
        path: src/ShelfSight-Windows.zip
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: src/ShelfSight-Windows.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y qt6-base-dev qt6-tools-dev libsqlite3-dev libsodium-dev cmake g++ make

    - name: Configure CMake
      working-directory: ${{ github.workspace }}/src
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build
      working-directory: ${{ github.workspace }}/src/build
      run: cmake --build . --config Release --parallel

    - name: Create package
      run: |
        mkdir release
        cp build/app/ShelfSight release/
        # Create AppDir structure for AppImage
        mkdir -p release/usr/bin
        cp build/app/ShelfSight release/usr/bin/
        # Create desktop file
        cat > release/ShelfSight.desktop << 'EOF'
        [Desktop Entry]
        Type=Application
        Name=ShelfSight
        Exec=ShelfSight
        Icon=ShelfSight
        Categories=Office;Database;
        EOF
        # Create AppImage (requires appimagetool)
        # wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        # chmod +x appimagetool-x86_64.AppImage
        # ./appimagetool-x86_64.AppImage release/ ShelfSight-Linux.AppImage

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: ShelfSight-Linux
        path: src/release/
        retention-days: 30